name: Deploy UI

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, prod]

concurrency:
  group: deploy-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & deploy (${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to Azure Static Website
        run: |
          set -euo pipefail
          DIST=""
          if [[ -d dist/spa ]]; then DIST="dist/spa"
          elif [[ -d dist ]]; then DIST="dist"
          else echo "UI build output not found"; exit 1
          fi

          ACCOUNT_KEY=$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)

          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --auth-mode key \
            --destination '$web' \
            --source "$DIST" \
            --overwrite true \
            --output none

      - name: Summary
        run: |
          ENDPOINT=$(az storage account show \
            --name "$STORAGE_ACCOUNT" \
            --query "primaryEndpoints.web" -o tsv)
          echo "### UI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'dev') }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $ENDPOINT" >> "$GITHUB_STEP_SUMMARY"
