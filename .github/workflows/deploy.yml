name: Deploy UI

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      client:
        description: Client environment to deploy (one GitHub Environment per client)
        required: true
        type: choice
        options: [chaacreek]

concurrency:
  group: deploy-ui-${{ github.event.inputs.client || 'chaacreek' }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & deploy (${{ github.event.inputs.client || 'chaacreek' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.client || 'chaacreek' }}
    env:
      CLIENT: ${{ github.event.inputs.client || 'chaacreek' }}
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://chaacreek.kamihrm.com/api' }}
      VITE_TENANT_SLUG: ${{ vars.TENANT_SLUG || github.event.inputs.client || 'chaacreek' }}
      STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT || 'stpayrollshrdprodi7i0ek' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to Azure Static Website
        run: |
          set -euo pipefail
          DIST=""
          if [[ -d dist/spa ]]; then DIST="dist/spa"
          elif [[ -d dist ]]; then DIST="dist"
          else echo "UI build output not found"; exit 1
          fi

          ACCOUNT_KEY=$(az storage account keys list \
            --account-name "$STORAGE_ACCOUNT" \
            --query "[0].value" -o tsv)

          az storage blob upload-batch \
            --account-name "$STORAGE_ACCOUNT" \
            --account-key "$ACCOUNT_KEY" \
            --auth-mode key \
            --destination '$web' \
            --source "$DIST" \
            --overwrite true \
            --output none

      - name: Summary
        run: |
          ENDPOINT=$(az storage account show \
            --name "$STORAGE_ACCOUNT" \
            --query "primaryEndpoints.web" -o tsv)
          echo "### UI deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Client environment: \`$CLIENT\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tenant slug: \`$VITE_TENANT_SLUG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $ENDPOINT" >> "$GITHUB_STEP_SUMMARY"
